services:

  nova:
    build: .
    container_name: nova
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Ollama tourne sur le host (pas dans Docker) → host.docker.internal
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # PostgreSQL du host (existant: db jarvis / user jarvis)
      DB_HOST: host.docker.internal
    volumes:
      - ./voices:/app/voices      # modèles Piper persistants
      - ./static:/app/static      # hot-reload du frontend possible
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

